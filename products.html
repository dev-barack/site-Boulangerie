<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks — Boulangerie Dana</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside>
            <div>
                <div class="sidebar-brand">
                    <img src="images/logo.PNG" alt="Logo">
                    <h2>D’Oree Admin</h2>
                </div>
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html">📊 Dashboard</a></li>
                    <li><a href="sales.html">💰 Ventes</a></li>
                    <li><a href="products.html" class="active">🥖 Stocks de Pains</a></li>
                    <li><a href="clients.html">👥 Équipe & Clients</a></li>
                </ul>
            </div>
        </aside>

        <main>
            <header>
                <h1>Gestion du Stock Journalier</h1>
                <p>Définissez la production du jour (synchronisée en direct avec l'application mobile).</p>
            </header>

            <div class="panel">
                <h3>Catalogue des Pains (Images pain3 à pain9)</h3>
                <div id="stock-products-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px;">
                    <!-- Les fiches produits avec images et inputs modifiables s'afficheront ici -->
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="script.js"></script>
