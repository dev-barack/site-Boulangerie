<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fidélité — Boulangerie DANA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-container">
    <aside>
      <div>
        <div class="sidebar-brand">
          <img src="images/logo.png" alt="Logo">
          <h2>DANA Admin</h2>
        </div>
        <ul class="sidebar-menu">
          <li><a href="dashboard.html">📊 Dashboard</a></li>
          <li><a href="users.html">👥 Gestion Utilisateurs</a></li>
          <li><a href="products.html">🥖 Produits</a></li>
          <li><a href="offers.html">🎯 Offres spéciales</a></li>
          <li><a href="orders.html">📦 Commandes</a></li>
          <li><a href="sales.html">💰 Ventes</a></li>
          <li><a href="qr_cards.html">🔖 QR / Cartes clients</a></li>
          <li><a href="loyalty.html" class="active">🏅 Fidélité</a></li>
          <li><a href="stats.html">📈 Statistiques</a></li>
          <li><a href="admins.html">🛡️ Administrateurs</a></li>
          <li><a href="settings.html">⚙️ Paramètres</a></li>
        </ul>
      </div>
      <div>
        <button id="logout-btn" class="btn" style="width:100%;background:#ef4444;border:none;padding:8px;border-radius:8px;color:white;cursor:pointer;">Déconnexion</button>
      </div>
    </aside>

    <main>
      <header class="app-header compact-header" role="banner">
        <div class="header-identity">
          <img src="images/logo.png" alt="Logo DANA" />
          <div class="header-identity-copy">
            <span class="header-page-title">Fidélité</span>
          </div>
        </div>
        <div class="header-right">
          <label class="header-search" aria-label="Recherche fidélité">
            <input id="loyalty-search" placeholder="Rechercher un client" aria-label="Recherche fidélité" />
          </label>
          <div id="profile-bubble">A</div>
        </div>
      </header>

      <div class="panel" style="margin-top:12px;">
        <table style="width:100%;font-size:13px;">
          <thead>
            <tr>
              <th>Client</th>
              <th>Points</th>
              <th>Commandes</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="loyalty-table-body">
            <tr><td colspan="4" class="empty-state">Chargement de la fidélité...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="script.js"></script>
  <script type="module" src="loyalty.js"></script>
</body>
</html>
