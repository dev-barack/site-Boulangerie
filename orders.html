<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Commandes — Boulangerie DANA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="orders-page">
  <div class="app-container">
    <aside>
      <div>
        <div class="sidebar-brand">
          <img src="images/logo.png" alt="Logo" />
          <h2>DANA Admin</h2>
        </div>
        <ul class="sidebar-menu">
          <li><a href="dashboard.html">📊 Dashboard</a></li>
          <li><a href="users.html">👥 Gestion Utilisateurs</a></li>
          <li><a href="products.html">🥖 Produits</a></li>
          <li><a href="orders.html" class="active">📦 Commandes</a></li>
          <li><a href="sales.html">💰 Ventes</a></li>
          <li><a href="qr_cards.html">🔖 QR / Cartes clients</a></li>
          <li><a href="loyalty.html">🏅 Fidélité</a></li>
          <li><a href="stats.html">📈 Statistiques</a></li>
          <li><a href="admins.html">🛡️ Administrateurs</a></li>
          <li><a href="settings.html">⚙️ Paramètres</a></li>
        </ul>
      </div>
      <div>
        <button id="logout-btn" class="btn" style="width:100%;background:#ef4444;border:none;padding:8px;border-radius:8px;color:white;cursor:pointer;">Déconnexion</button>
      </div>
    </aside>

    <main>
      <header class="app-header compact-header" role="banner">
        <div class="header-identity">
          <img src="images/logo.png" alt="Logo DANA" />
          <div class="header-identity-copy">

            <span class="header-page-title">Commandes</span>
          </div>
        </div>

        <div class="header-right">
          <label class="header-search" aria-label="Recherche commandes">
            <input id="orders-search" placeholder="Rechercher (client, ID)" aria-label="Recherche commande" />
          </label>
          <div id="profile-bubble">A</div>
        </div>
      </header>

      <div class="page-toolbar" aria-label="Actions commande">
        <div class="toolbar-left"></div>
        <div class="toolbar-actions">
          <button id="orders-toggle-filters" class="btn btn-ghost" type="button">Filtres</button>
          <select id="orders-filter-status" aria-label="Filtre statut">
            <option value="">Tous les statuts</option>
            <option value="VALIDATED">Validée</option>
            <option value="PENDING">En attente</option>
            <option value="READY">Prête</option>
            <option value="PICKED_UP">Retirée</option>
            <option value="CANCELLED">Annulée</option>
          </select>
          <button id="btn-create-order" class="btn" type="button">Créer une commande</button>
        </div>
      </div>

      <div class="panel" style="margin-top:12px;">
        <div id="orders-loading" class="orders-spinner" aria-live="polite" hidden>Chargement...</div>
        <table style="width:100%;font-size:13px;">
          <thead>
            <tr>
              <th>ID</th>
              <th>Client</th>
              <th>Date</th>
              <th>Montant</th>
              <th>Statut</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="orders-table-body">
            <tr><td colspan="6" class="empty-state">Chargement des commandes...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="script.js"></script>
  <script type="module" src="orders.js"></script>
</body>
</html>
